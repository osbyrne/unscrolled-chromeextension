<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feed blocking</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main>
      <section class="limit-pause" aria-label="Pause post limits">
        <button id="pause-limits" type="button" aria-pressed="false" aria-describedby="pause-status" disabled>Pause limits for 3 minutes</button>
        <p id="pause-status" class="hint" role="status">Applies to X and Instagram.</p>
        <p id="pause-error" role="alert" hidden></p>
      </section>
    </main>
  </body>
</html>
